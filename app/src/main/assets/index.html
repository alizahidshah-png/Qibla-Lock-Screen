<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Qibla Lock Screen</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1c3654,#08111f 65%);color:#f5f1e8;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{width:100%;max-width:440px}.brand{letter-spacing:.25em;text-transform:uppercase;font-size:11px;color:#c5aa72}.time{font-size:clamp(64px,18vw,100px);font-weight:200;letter-spacing:-.06em;line-height:1.1;margin:16px 0 6px}.date{font-size:17px;color:#e5d8bd}.hijri{margin-top:8px;color:#c6b07d;font-size:15px}.rule{width:54px;height:1px;background:#a68c58;margin:28px auto}.compass{width:min(68vw,260px);height:min(68vw,260px);margin:auto;border:1px solid #a68c5866;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#172b41 0,#0a1728 70%);box-shadow:0 0 45px #0005}.ring{position:absolute;inset:12px;border:1px dashed #b69b6655;border-radius:50%}.north{position:absolute;top:17px;color:#e7d09b;font-size:12px;letter-spacing:.12em}.needle{width:4px;height:174px;position:absolute;left:calc(50% - 2px);top:calc(50% - 87px);transform-origin:center;transition:transform .15s}.needle:before{content:"";display:block;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:79px solid #e8cc83;position:absolute;top:0;left:-7px}.needle:after{content:"";position:absolute;top:79px;left:-7px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:79px solid #59748c}.kaaba{width:44px;height:44px;background:#111;border:2px solid #c9a85e;outline:4px solid #111;border-radius:50%;display:grid;place-items:center;color:#e6c77b;font-size:21px;z-index:1}.status{margin:20px 0 5px;font-size:15px;color:#d8c9a8}.bearing{font-size:12px;color:#91a4b8}.note{font-size:11px;color:#7f92a8;margin-top:28px;line-height:1.6}
</style></head><body><main class="wrap"><div class="brand">✦ Qibla • Prayer Companion</div><div class="time" id="time">--:--</div><div class="date" id="date">Loading date…</div><div class="hijri" id="hijri">Loading Hijri date…</div><div class="rule"></div><div class="compass"><div class="ring"></div><div class="north">N</div><div class="needle" id="needle"></div><div class="kaaba">✦</div></div><div class="status" id="status">Finding your Qibla direction…</div><div class="bearing" id="bearing">Allow location for accurate direction</div><div class="note">Keep your phone flat and away from metal objects.<br>Calibrate the compass if the direction seems inaccurate.</div></main>
<script>
const $=id=>document.getElementById(id);
function gregorianJD(date){const y=date.getUTCFullYear(),m=date.getUTCMonth()+1,d=date.getUTCDate();const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function islamicJD(y,m,d){return d+Math.ceil(29.5*(m-1))+(y-1)*354+Math.floor((3+11*y)/30)+1948439}
function fallbackHijri(date){const jd=gregorianJD(date);const y=Math.floor((30*(jd-1948439)+10646)/10631);let m=Math.min(12,Math.ceil((jd-(29+islamicJD(y,1,1)))/29.5)+1);m=Math.max(1,m);let d=jd-islamicJD(y,m,1)+1;const months=['Muharram','Safar','Rabi al-Awwal','Rabi al-Thani','Jumada al-Awwal','Jumada al-Thani','Rajab','Sha’ban','Ramadan','Shawwal','Dhu al-Qi’dah','Dhu al-Hijjah'];return d+' '+months[m-1]+' '+y+' AH'}
function tick(){const now=new Date();$('time').textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',hour12:false}).format(now);$('date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);try{const fmt=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric',calendar:'islamic-umalqura'});const parts=fmt.formatToParts(now);const month=parts.find(p=>p.type==='month')?.value||'';const year=parts.find(p=>p.type==='year')?.value||'';if(/^(January|February|March|April|May|June|July|August|September|October|November|December)$/i.test(month)||!year||/BC|BCE/i.test(fmt.format(now)))throw new Error('Hijri calendar unsupported');$('hijri').textContent=fmt.format(now)+' AH'}catch(e){$('hijri').textContent=fallbackHijri(now)}}
tick();setInterval(tick,1000);
let bearing=null,heading=0,hasLocation=false;
function qibla(lat,lon){const rad=Math.PI/180,la=21.4225*rad,lo=39.8262*rad,p=lat*rad,l=lon*rad;let b=Math.atan2(Math.sin(lo-l),Math.cos(p)*Math.tan(la)-Math.sin(p)*Math.cos(lo-l))*180/Math.PI;return (b+360)%360}
function updateLocation(lat,lon){if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;hasLocation=true;bearing=qibla(lat,lon);$('status').textContent='Qibla direction ready';$('bearing').textContent='Qibla bearing '+Math.round(bearing)+'° from true north';draw()}
function updateHeading(deg){heading=(deg+360)%360;draw()}
function draw(){if(bearing!==null)$('needle').style.transform='rotate('+(bearing-heading)+'deg)'}
try{if(window.AndroidBridge){updateLocation(AndroidBridge.getLatitude(),AndroidBridge.getLongitude())}}catch(e){}
</script></body></html>
